name: Deploy

on:
  push:
    branches: [main]
  schedule:
    # Pages of items and heroes the game has gained since (the catalog is made again after each update)
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# The app reads every list and file from the datasets in the browser; the build also makes a page of
# its own for every hero, item and section from the tracker's catalog (scripts/prerender.mjs), for
# search engines and link previews.
# Built and deployed in two jobs: deploy-pages lists the run's artifacts, and since 2026-11-21 the
# one uploaded a moment before in the same job is not in that list yet ("Found 0 artifact(s)");
# the deploy job starts on another runner, by which time it is
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
        env:
          # github.com/microsoft/onnxruntime returns 404, so onnxruntime-node cannot fetch its CUDA
          # binaries; the runners have no GPU and the CPU runtime ships in the npm package
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
